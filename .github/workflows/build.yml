name: Build Arclight
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: arclight-jar
          path: '**/build/libs/*.jar'
